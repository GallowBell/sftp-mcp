listen=YES
listen_ipv6=NO
listen_port=990
implicit_ssl=YES
background=NO
anonymous_enable=NO
local_enable=YES
write_enable=YES
chroot_local_user=YES
allow_writeable_chroot=YES
secure_chroot_dir=/var/run/vsftpd/empty
seccomp_sandbox=NO
pasv_enable=YES
pasv_min_port=21200
pasv_max_port=21210
pasv_address=127.0.0.1
ssl_enable=YES
force_local_logins_ssl=YES
force_local_data_ssl=YES
ssl_sslv3=NO
ssl_tlsv1=NO
ssl_tlsv1_1=NO
ssl_tlsv1_2=YES
ssl_ciphers=HIGH
# test-only: basic-ftp reuses TLS sessions, but vsftpd's check is strict across processes; production vsftpd defaults to YES
require_ssl_reuse=NO
rsa_cert_file=/certs/server.crt
rsa_private_key_file=/certs/server.key
